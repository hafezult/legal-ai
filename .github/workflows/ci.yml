name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - cursor/overall-project-finalization-5ad8

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: aether
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d aether"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/aether?schema=public
      DIRECT_URL: postgresql://user:password@localhost:5432/aether?schema=public
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_dummy
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role
      SUPABASE_DOCUMENT_BUCKET: legal-documents
      OPENAI_API_KEY: ""
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Intentionally denylisted prefix — CI must not use a production-strong secret.
      INDEXING_SECRET: aether-ci-validate-5ad8-78757d09d86c0607!

    steps:
      - name: Check out repository
        # Pin full commit SHA for supply-chain integrity (actions/checkout@v7).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        # Pin full commit SHA for supply-chain integrity (actions/setup-node@v7).
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations (pgvector)
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
